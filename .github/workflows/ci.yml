name: CI

# Runs on every push and pull request, regardless of branch. This is
# validation only -- no AWS credentials involved, no deployment. CD
# (deploy.yml) is separate and only runs on merge to main.

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 scripts/ --max-line-length=120

      - name: Format check (black)
        run: black --check scripts/

      - name: Run unit tests
        run: pytest tests/ -v
